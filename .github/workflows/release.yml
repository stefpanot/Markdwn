name: Release

on:
  push:
    tags: ['v*']
  # A manual run builds downloadable artifacts without publishing a release.
  workflow_dispatch:
  # prepare-release.yml calls us right after pushing the release tag. Needed
  # because a tag pushed by GITHUB_TOKEN does not trigger push workflows.
  workflow_call:
    inputs:
      tag:
        description: 'Tag vX.Y.Z poussé par le workflow de préparation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Appelé par prepare-release.yml, le ref par défaut serait le SHA du
          # dispatch (pré-bump) : la vérification tag ↔ version échouerait.
          # Le bump a déjà poussé le tag quand ce job tourne (needs: bump) :
          # on checkoute exactement le contenu tagué, comme le job build.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # Piège GitHub : dans un workflow réutilisable, `github.event_name`
          # reste celui de L'APPELANT (workflow_dispatch depuis prepare-
          # release.yml), il ne vaut jamais "workflow_call". Seule `inputs.tag`
          # trahit l'appel — c'est elle qu'on teste.
          CALLED: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] || [ -n "$CALLED" ]; then
            node scripts/version.mjs tag "$TAG"
          else
            node scripts/version.mjs check
          fi
      - run: npm run test:version
      - id: meta
        env:
          # Sur un push de tag, inputs.tag est vide : le tag est le ref.
          TAG: ${{ inputs.tag || github.ref_name }}
          CALLED: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          publish=false
          if [ "$EVENT" = push ] || [ -n "$CALLED" ]; then
            publish=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Appelé par prepare-release.yml, le ref par défaut serait main ;
          # on build exactement le contenu tagué.
          ref: ${{ needs.version.outputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        env:
          # Ad-hoc signing, without an Apple Developer certificate or notarization.
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
          TARGET: ${{ matrix.target }}
          # MSI uses numeric product versions; betas use NSIS only.
          BUNDLES: ${{ runner.os == 'Windows' && needs.version.outputs.prerelease == 'true' && 'nsis' || matrix.bundles }}
        shell: bash
        run: npm run tauri -- build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  publish:
    # Tag poussé à la main ou appelé par prepare-release.yml : on publie.
    # workflow_dispatch manuel : artefacts seulement, pas de release.
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            test ! -e "assets/$name"
            cp "$file" "assets/$name"
          done < <(find installers -type f -print0)
          mapfile -d '' files < <(find assets -type f -print0)
          test "${#files[@]}" -gt 0
          (cd assets && sha256sum *) > SHA256SUMS.txt
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
            --verify-tag --draft --title "Markdwn $TAG" --generate-notes "${flags[@]}"
          gh release edit "$TAG" --draft=false "${flags[@]}"
