name: Release

on:
  push:
    tags: ['v*']
  # A manual run builds downloadable artifacts without publishing a release.
  workflow_dispatch:
  # prepare-release.yml calls us right after pushing the release tag. Needed
  # because a tag pushed by GITHUB_TOKEN does not trigger push workflows.
  workflow_call:
    inputs:
      tag:
        description: 'Tag vX.Y.Z poussé par le workflow de préparation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Appelé par prepare-release.yml, le ref par défaut serait le SHA du
          # dispatch (pré-bump) : la vérification tag ↔ version échouerait.
          # Le bump a déjà poussé le tag quand ce job tourne (needs: bump) :
          # on checkoute exactement le contenu tagué, comme le job build.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # Piège GitHub : dans un workflow réutilisable, `github.event_name`
          # reste celui de L'APPELANT (workflow_dispatch depuis prepare-
          # release.yml), il ne vaut jamais "workflow_call". Seule `inputs.tag`
          # trahit l'appel — c'est elle qu'on teste.
          CALLED: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] || [ -n "$CALLED" ]; then
            node scripts/version.mjs tag "$TAG"
          else
            node scripts/version.mjs check
          fi
      - run: npm run test:version
      - id: meta
        env:
          # Sur un push de tag, inputs.tag est vide : le tag est le ref.
          TAG: ${{ inputs.tag || github.ref_name }}
          CALLED: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          publish=false
          if [ "$EVENT" = push ] || [ -n "$CALLED" ]; then
            publish=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            # « app » produit le .app.tar.gz requis par l'auto-update (dmg seul
            # ne suffit pas) ; dmg reste l'installateur téléchargeable.
            bundles: dmg,app
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Appelé par prepare-release.yml, le ref par défaut serait main ;
          # on build exactement le contenu tagué.
          ref: ${{ needs.version.outputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        env:
          # Ad-hoc signing, without an Apple Developer certificate or notarization.
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
          TARGET: ${{ matrix.target }}
          # MSI uses numeric product versions; betas use NSIS only.
          BUNDLES: ${{ runner.os == 'Windows' && needs.version.outputs.prerelease == 'true' && 'nsis' || matrix.bundles }}
          # Signature des installeurs pour l'auto-update (minisign). Quand les
          # secrets sont absents (fork), le build reste possible mais non
          # mettable à jour : la CI doit échouer tôt plutôt que de publier
          # silencieusement sans .sig, d'où le test explicite.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri -- build --target "$TARGET" --bundles "$BUNDLES" -- --locked
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY manquant : les installeurs ne seraient pas signés."
            exit 1
          fi
      - name: Rename macOS updater bundle per arch
        # Les deux jobs macOS produisent chacun « Markdwn.app.tar.gz » : à
        # l'assemblage des artefacts, le second écrase le premier et l'une des
        # deux arches disparaît (vu sur la beta.3). On injecte l'arch dans le
        # nom APRÈS le build et avant l'upload, conforme aux motifs de
        # updater-manifest.py. NB : ce step doit rester après « Build installers ».
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          d="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          arch=$([ "${{ matrix.target }}" = x86_64-apple-darwin ] && echo x64 || echo aarch64)
          mv "$d/Markdwn.app.tar.gz" "$d/Markdwn_${TAG}_${arch}.app.tar.gz"
          mv "$d/Markdwn.app.tar.gz.sig" "$d/Markdwn_${TAG}_${arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  publish:
    # Tag poussé à la main ou appelé par prepare-release.yml : on publie.
    # workflow_dispatch manuel : artefacts seulement, pas de release.
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Le dépôt contient un dossier `assets/` (checkout) : utiliser un
          # nom dédié, sinon `mkdir` échoue et `find assets` y inclurait
          # les fichiers du dépôt (vu le 2026-09-22 sur la beta.4).
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            test ! -e "release-assets/$name"
            cp "$file" "release-assets/$name"
          done < <(find installers -type f -print0)
          mapfile -d '' files < <(find release-assets -type f -print0)
          test "${#files[@]}" -gt 0
          (cd release-assets && sha256sum *) > SHA256SUMS.txt
          # Les betas sont publiées en releases COMPLETES : GitHub interdit
          # qu'une release « prerelease » soit « latest », et l'endpoint de
          # l'auto-update (/releases/latest/download/latest.json) ne résout
          # que la release « latest ». En --prerelease, l'auto-update était
          # donc mort depuis la beta.1 (vu le 2026-09-24). Le caractère beta
          # reste visible dans le titre et le tag.
          flags=()
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
            --verify-tag --draft --title "Markdwn $TAG" --generate-notes "${flags[@]}"
          gh release edit "$TAG" --draft=false "${flags[@]}"
          # Garde-fou : gh a déjà laissé tomber un asset en silence (dmg
          # aarch64 de la beta.3). On vérifie que tout est arrivé.
          have=$(gh release view "$TAG" --json assets --jq '.assets | length')
          want=$(find release-assets -type f -printf '.' | wc -c)
          if [ "$have" -lt "$want" ]; then
            echo "::error::$want fichiers attendus, $have uploadés sur la release."
            exit 1
          fi

      # Auto-update : le endpoint de tauri.conf.json sert le latest.json de la
      # release marquée « latest » — la plus récente, betas comprises. Chaque
      # plateforme pointe vers son installeur signé (signature minisign =
      # contenu du .sig généré au build).
      - name: latest.json for the updater
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/updater-manifest.py "$TAG" release-assets
          gh release upload "$TAG" latest.json --clobber
